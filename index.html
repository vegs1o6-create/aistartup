<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Domenet er til salgs</title>
  <meta name="description" content="Dette domenet er til salgs. Ta kontakt på vegs1o6@gmail.com">
  <meta name="theme-color" content="#23352f">
  <link rel="preload" as="image" href="assets/garasje.webp" type="image/webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --grass: #23352f;
      --ink: #f6ecdc;
      --muted: rgba(246, 236, 220, 0.72);
      --glow: #f2b46a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: "Manrope", system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background: var(--grass);
      min-height: 100svh;
      display: flex;
      align-items: flex-end;
      -webkit-font-smoothing: antialiased;
    }

    /* Full-bleed illustration. Anchored low so the lawn stays in view,
       with a soft shade over the grass for legible text. */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        linear-gradient(20deg, rgba(20, 32, 27, 0.7) 0%, rgba(20, 32, 27, 0.35) 30%, rgba(20, 32, 27, 0) 50%),
        url("assets/garasje.webp") 50% 92% / cover no-repeat,
        var(--grass);
    }

    /* Portrait screens: the lawn is too narrow to hold the text, so let the
       picture fade into the grass colour and set the text on that. */
    @media (max-aspect-ratio: 4/5) {
      body::before {
        background:
          linear-gradient(180deg, rgba(35, 53, 47, 0) 45%, rgba(35, 53, 47, 0.85) 62%, var(--grass) 72%),
          url("assets/garasje.webp") 50% 0 / auto 78svh no-repeat,
          var(--grass);
      }
    }

    main {
      position: relative;
      z-index: 1;
      width: min(520px, 100%);
      padding: 0 clamp(24px, 5vw, 72px) clamp(40px, 7vh, 80px);
      animation: fade 1.6s ease-out both;
      text-shadow: 0 1px 12px rgba(12, 20, 16, 0.55);
    }

    @keyframes fade {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: none; }
    }

    h1 {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 300;
      font-size: clamp(1.9rem, 4vw, 2.75rem);
      line-height: 1.15;
      letter-spacing: -0.01em;
      text-wrap: balance;
    }

    h1 em { font-style: italic; color: var(--glow); }

    .lead {
      margin-top: 14px;
      font-size: clamp(0.98rem, 1.6vw, 1.08rem);
      line-height: 1.65;
      color: var(--muted);
      text-wrap: pretty;
    }

    .links {
      margin-top: 26px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 0.95rem;
    }

    a {
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid rgba(246, 236, 220, 0.35);
      padding-bottom: 2px;
      transition: color 0.3s ease, border-color 0.3s ease;
    }

    a:hover, a:focus-visible {
      color: var(--glow);
      border-color: var(--glow);
      outline: none;
    }

    .quiet a { color: var(--muted); border-color: rgba(246, 236, 220, 0.2); }

    @media (prefers-reduced-motion: reduce) {
      main { animation: none; }
      a { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Noen ganger starter det i en <em>garasje</em>.</h1>
    <p class="lead">Dette domenet er til salgs, klart for neste idé.</p>
    <div class="links">
      <p>Ta kontakt på <a href="mailto:vegs1o6@gmail.com">vegs1o6@gmail.com</a></p>
      <p class="quiet"><a href="https://seiltips.no" target="_blank" rel="noopener">Sjekk ut en agentdrevet nettside her &rarr;</a></p>
    </div>
  </main>
</body>
</html>
