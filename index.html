<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Domenet er til salgs</title>
  <meta name="description" content="Dette domenet er til salgs! Ta kontakt på vegs1o6@gmail.com">
  <meta name="theme-color" content="#1e2e30">
  <link rel="preload" as="image" href="assets/garasje.webp" type="image/webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      /* Palette sampled from the background illustration: dusk teal walls, warm garage glow */
      --night: #1e2e30;
      --glass: rgba(24, 38, 40, 0.58);
      --glass-edge: rgba(255, 236, 210, 0.16);
      --glass-hi: rgba(255, 236, 210, 0.08);
      --ink: #fbf1e3;
      --muted: rgba(251, 241, 227, 0.74);
      --amber: #f2a650;
      --ember: #e0773a;
      --accent-ink: #231509;
      --live: #7fd18b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { min-height: 100%; }

    body {
      font-family: "Manrope", system-ui, -apple-system, sans-serif;
      background: var(--night);
      color: var(--ink);
      display: grid;
      place-items: center;
      min-height: 100svh;
      padding: 32px 16px;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    /* Full-bleed background image. A fixed pseudo-element instead of
       background-attachment: fixed, which iOS Safari ignores. */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 70% 60% at 50% 50%, rgba(20, 30, 32, 0.15), rgba(20, 30, 32, 0.6) 100%),
        linear-gradient(180deg, rgba(20, 30, 32, 0.35), rgba(20, 30, 32, 0.15) 40%, rgba(20, 30, 32, 0.55)),
        url("assets/garasje.webp") center 55% / cover no-repeat,
        var(--night);
    }

    main {
      position: relative;
      z-index: 1;
      width: min(560px, 100%);
      padding: clamp(32px, 7vw, 56px) clamp(22px, 6vw, 52px);
      border-radius: 32px;
      background: var(--glass);
      border: 1px solid var(--glass-edge);
      backdrop-filter: blur(18px) saturate(130%);
      -webkit-backdrop-filter: blur(18px) saturate(130%);
      box-shadow: 0 30px 70px -20px rgba(8, 14, 15, 0.7), inset 0 1px 0 var(--glass-hi);
      text-align: center;
      animation: rise 0.8s cubic-bezier(.2,.8,.2,1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Status pill with a glowing LED */
    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(255, 236, 210, 0.06);
      border: 1px solid var(--glass-edge);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .led {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--live);
      box-shadow: 0 0 10px 1px rgba(127, 209, 139, 0.7);
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse {
      50% { box-shadow: 0 0 16px 3px rgba(127, 209, 139, 0.35); }
    }

    /* Price-tag emblem, lit like the garage lamp */
    .emblem {
      width: 96px;
      height: 96px;
      margin: 30px auto 26px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 40%, rgba(242, 166, 80, 0.28), rgba(242, 166, 80, 0.04) 70%);
      border: 1px solid rgba(242, 166, 80, 0.3);
      box-shadow: 0 0 40px -6px rgba(242, 166, 80, 0.45);
    }

    .emblem-inner { color: var(--amber); display: grid; place-items: center; }

    .emblem svg { width: 38px; height: 38px; }

    h1 {
      font-size: clamp(2rem, 6.5vw, 3rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.03em;
      text-wrap: balance;
      text-shadow: 0 2px 18px rgba(8, 14, 15, 0.45);
    }

    .lead {
      margin-top: 14px;
      font-size: clamp(1rem, 2.4vw, 1.1rem);
      line-height: 1.6;
      color: var(--muted);
    }

    .contact { margin-top: 32px; }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 56px;
      padding: 14px 22px;
      border-radius: 18px;
      font: inherit;
      font-weight: 600;
      text-decoration: none;
      transition: box-shadow 0.2s ease, transform 0.2s ease, color 0.2s ease, background-color 0.2s ease;
      word-break: break-word;
    }

    .btn svg { width: 22px; height: 22px; flex-shrink: 0; }

    .btn-primary {
      color: var(--accent-ink);
      background: linear-gradient(145deg, var(--amber), var(--ember));
      box-shadow: 0 12px 30px -10px rgba(224, 119, 58, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 38px -10px rgba(224, 119, 58, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }

    .btn-primary:active { transform: translateY(0); }

    .btn-secondary {
      margin-top: 14px;
      color: var(--ink);
      background: rgba(255, 236, 210, 0.05);
      border: 1px solid var(--glass-edge);
    }

    .btn-secondary .arrow {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      color: var(--amber);
      background: rgba(242, 166, 80, 0.12);
      transition: transform 0.2s ease;
    }

    .btn-secondary .arrow svg { width: 16px; height: 16px; }

    .btn-secondary:hover { color: var(--amber); background: rgba(255, 236, 210, 0.09); }
    .btn-secondary:hover .arrow { transform: translateX(3px); }

    .btn:focus-visible {
      outline: 2px solid var(--amber);
      outline-offset: 4px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <span class="status"><span class="led" aria-hidden="true"></span>Tilgjengelig</span>

    <div class="emblem" aria-hidden="true">
      <div class="emblem-inner">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8Z"/>
          <circle cx="7.5" cy="7.5" r="1.5" fill="currentColor"/>
        </svg>
      </div>
    </div>

    <h1>Dette domenet er til salgs!</h1>
    <p class="lead">Interessert? Send en e-post, så tar vi en prat om pris og overføring.</p>

    <div class="contact">
      <a class="btn btn-primary" href="mailto:vegs1o6@gmail.com">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="2.5"/>
          <path d="m3.5 6.5 8.5 6.5 8.5-6.5"/>
        </svg>
        vegs1o6@gmail.com
      </a>
    </div>

    <a class="btn btn-secondary" href="https://seiltips.no" target="_blank" rel="noopener">
      Sjekk ut en agentdrevet nettside her
      <span class="arrow" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M13 6l6 6-6 6"/>
        </svg>
      </span>
    </a>
  </main>
</body>
</html>
