<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Domenet er til salgs</title>
  <meta name="description" content="Dette domenet er til salgs! Ta kontakt på vegs1o6@gmail.com">
  <meta name="theme-color" content="#e3e8ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#262b35" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #e3e8ef;
      --surface-top: #eaeef4;
      --surface-bottom: #dce2ea;
      --light: rgba(255, 255, 255, 0.9);
      --dark: rgba(163, 177, 198, 0.75);
      --ink: #2c3a55;
      --muted: #6b7a93;
      --accent: #4f6bed;
      --accent-deep: #3b54cc;
      --accent-ink: #ffffff;
      --live: #22c07a;

      --raise: 9px 9px 18px var(--dark), -9px -9px 18px var(--light);
      --raise-lg: 20px 20px 44px var(--dark), -20px -20px 44px var(--light);
      --raise-sm: 5px 5px 10px var(--dark), -5px -5px 10px var(--light);
      --inset: inset 6px 6px 12px var(--dark), inset -6px -6px 12px var(--light);
      --inset-sm: inset 3px 3px 6px var(--dark), inset -3px -3px 6px var(--light);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #262b35;
        --surface-top: #2b313c;
        --surface-bottom: #22272f;
        --light: rgba(58, 66, 81, 0.85);
        --dark: rgba(12, 14, 19, 0.7);
        --ink: #e4e9f2;
        --muted: #98a3b8;
        --accent: #7088ff;
        --accent-deep: #566ff0;
        --accent-ink: #0f1422;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { min-height: 100%; }

    body {
      font-family: "Manrope", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: grid;
      place-items: center;
      min-height: 100svh;
      padding: 32px 16px;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(560px, 100%);
      padding: clamp(32px, 7vw, 56px) clamp(22px, 6vw, 52px);
      border-radius: 40px;
      background: linear-gradient(145deg, var(--surface-top), var(--surface-bottom));
      box-shadow: var(--raise-lg);
      text-align: center;
      animation: rise 0.8s cubic-bezier(.2,.8,.2,1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Status pill – inset groove with a glowing LED */
    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 9px 18px;
      border-radius: 999px;
      box-shadow: var(--inset-sm);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .led {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #b8ffd9, var(--live) 60%);
      box-shadow: 0 0 0 2px var(--bg), 0 0 10px 1px rgba(34, 192, 122, 0.65);
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse {
      50% { box-shadow: 0 0 0 2px var(--bg), 0 0 16px 3px rgba(34, 192, 122, 0.35); }
    }

    /* Raised dial holding a price-tag icon */
    .emblem {
      width: 112px;
      height: 112px;
      margin: 32px auto 28px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, var(--surface-top), var(--surface-bottom));
      box-shadow: var(--raise);
    }

    .emblem-inner {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      box-shadow: var(--inset);
      color: var(--accent);
    }

    .emblem svg { width: 36px; height: 36px; }

    h1 {
      font-size: clamp(2rem, 6.5vw, 3rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.03em;
      text-wrap: balance;
      text-shadow: 1px 1px 1px var(--light);
    }

    .lead {
      margin-top: 14px;
      font-size: clamp(1rem, 2.4vw, 1.1rem);
      line-height: 1.6;
      color: var(--muted);
    }

    /* Inset "slot" holding the address like an engraved plate */
    .contact {
      margin-top: 32px;
      padding: 10px;
      border-radius: 28px;
      box-shadow: var(--inset);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 56px;
      padding: 14px 22px;
      border-radius: 20px;
      font: inherit;
      font-weight: 600;
      text-decoration: none;
      transition: box-shadow 0.2s ease, transform 0.2s ease, color 0.2s ease;
      word-break: break-word;
    }

    .btn svg { width: 22px; height: 22px; flex-shrink: 0; }

    .btn-primary {
      color: var(--accent-ink);
      background: linear-gradient(145deg, var(--accent), var(--accent-deep));
      box-shadow: 6px 6px 14px var(--dark), -6px -6px 14px var(--light),
                  inset 1px 1px 1px rgba(255, 255, 255, 0.35);
    }

    .btn-primary:hover { transform: translateY(-1px); }

    .btn-primary:active {
      transform: translateY(0);
      box-shadow: inset 4px 4px 10px rgba(0, 0, 0, 0.25),
                  inset -3px -3px 8px rgba(255, 255, 255, 0.15);
    }

    .btn-secondary {
      margin-top: 26px;
      color: var(--ink);
      background: linear-gradient(145deg, var(--surface-top), var(--surface-bottom));
      box-shadow: var(--raise-sm);
    }

    .btn-secondary .arrow {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      box-shadow: var(--inset-sm);
      flex-shrink: 0;
      color: var(--accent);
      transition: transform 0.2s ease;
    }

    .btn-secondary .arrow svg { width: 16px; height: 16px; }

    .btn-secondary:hover { color: var(--accent); }
    .btn-secondary:hover .arrow { transform: translateX(3px); }

    .btn-secondary:active {
      box-shadow: var(--inset-sm);
    }

    .btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }


    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <span class="status"><span class="led" aria-hidden="true"></span>Tilgjengelig</span>

    <div class="emblem" aria-hidden="true">
      <div class="emblem-inner">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8Z"/>
          <circle cx="7.5" cy="7.5" r="1.5" fill="currentColor"/>
        </svg>
      </div>
    </div>

    <h1>Dette domenet er til salgs!</h1>
    <p class="lead">Interessert? Send en e-post, så tar vi en prat om pris og overføring.</p>

    <div class="contact">
      <a class="btn btn-primary" href="mailto:vegs1o6@gmail.com">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="2.5"/>
          <path d="m3.5 6.5 8.5 6.5 8.5-6.5"/>
        </svg>
        vegs1o6@gmail.com
      </a>
    </div>

    <a class="btn btn-secondary" href="https://seiltips.no" target="_blank" rel="noopener">
      Sjekk ut en agentdrevet nettside her
      <span class="arrow" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M13 6l6 6-6 6"/>
        </svg>
      </span>
    </a>
  </main>
</body>
</html>
